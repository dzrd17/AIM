
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pyRevit 기능 안내 | DH Standard</title>
  <style>
    :root {
      --bg: #f5f1e8;
      --surface: #ffffff;
      --surface-warm: #ffef5a;
      --fg: #000000;
      --fg-2: #222222;
      --muted: #555555;
      --meta: #000000;
      --border: #000000;
      --border-soft: #000000;
      --accent: #ffef5a;
      --accent-on: #000000;
      --accent-hover: color-mix(in oklab, var(--accent), black 8%);
      --accent-active: color-mix(in oklab, var(--accent), black 14%);
      --success: #00b050;
      --warn: #ff8c00;
      --danger: #ff2b2b;
      --font-display: Arial Black, Impact, sans-serif;
      --font-body: Arial, Helvetica, sans-serif;
      --font-mono: "Courier New", ui-monospace, monospace;
      --text-xs: 12px;
      --text-sm: 14px;
      --text-base: 17px;
      --text-lg: 20px;
      --text-xl: 28px;
      --text-2xl: 42px;
      --text-3xl: 64px;
      --text-4xl: 88px;
      --leading-body: 1.35;
      --leading-tight: 0.98;
      --tracking-display: 0;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-12: 48px;
      --section-y-desktop: 88px;
      --section-y-tablet: 64px;
      --section-y-phone: 44px;
      --radius-sm: 0px;
      --radius-md: 0px;
      --radius-lg: 0px;
      --radius-pill: 9999px;
      --elev-flat: none;
      --elev-ring: 0 0 0 1px var(--border);
      --elev-raised: 8px 8px 0 #000000;
      --focus-ring: 0 0 0 4px #000000, 0 0 0 8px #ffef5a;
      --motion-fast: 90ms;
      --motion-base: 140ms;
      --ease-standard: steps(2, end);
      --container-max: 1160px;
      --container-gutter-desktop: 36px;
      --container-gutter-tablet: 24px;
      --container-gutter-phone: 16px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { max-width: 100%; overflow-x: hidden; scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      max-width: 100%;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: var(--leading-body);
      text-rendering: optimizeLegibility;
    }
    a { color: inherit; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    h1, h2, h3, h4 { margin: 0; font-family: var(--font-display); line-height: var(--leading-tight); text-wrap: balance; }
    :where(h1, h2, h3, h4, p, li, dt, dd, a, button, span, summary, strong) {
      max-width: 100%;
      overflow-wrap: break-word;
      word-break: keep-all;
    }
    .container {
      width: min(100%, var(--container-max));
      margin-inline: auto;
      padding-inline: var(--container-gutter-desktop);
    }
    .topnav {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--surface);
      border-bottom: 3px solid var(--border);
    }
    .topnav-inner {
      min-height: 70px;
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      gap: var(--space-4);
    }


    .nav-links {
      display: flex;
      align-items: stretch;
      border-inline: 2px solid var(--border);
    }
    .nav-links a {
      display: flex;
      align-items: center;
      padding-inline: var(--space-4);
      border-right: 2px solid var(--border);
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      font-weight: 700;
      text-transform: uppercase;
    }
    .hero {
      padding-block: clamp(var(--section-y-phone), 9vw, var(--section-y-desktop));
      border-bottom: 3px solid var(--border);
    }

    .lead {
      max-width: 64ch;
      margin: var(--space-5) 0 0;
      color: var(--fg-2);
      font-size: var(--text-lg);
    }
    .stat-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--surface);
      border: 3px solid var(--border);
      box-shadow: var(--elev-raised);
    }
    .stat {
      min-height: 150px;
      padding: var(--space-5);
      border-right: 3px solid var(--border);
    }
    @media (max-width: 700px) {

      .stat-board { grid-template-columns: 1fr; }
    }



@media (max-width: 920px) {

}




.logo {
  display: inline-flex;
  align-items: center;
  gap: var(--space-3);
  color: var(--fg);
  text-decoration: none;
  font-family: var(--font-display);
  font-size: var(--logo-size, var(--text-lg));
  letter-spacing: -0.04em;
  white-space: nowrap;
}
.logo-mark {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 40px;
  height: 40px;
  padding-inline: var(--space-2);
  background: var(--surface);
  border: 3px solid var(--border);
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 900;
}
.display {
  font-size: var(--display-size, clamp(32px, 6vw, 64px));
  letter-spacing: -0.04em;
  line-height: var(--leading-tight);
  white-space: nowrap;
  max-width: none;
}
@media (max-width: 920px) {
  .display { white-space: normal; }
}
.ds-table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); margin-top: var(--space-4); }
.ds-table th, .ds-table td { padding: var(--space-3); text-align: left; border-bottom: 2px solid var(--border); }
.ds-table th { background: var(--bg); font-family: var(--font-mono); font-weight: 700; text-transform: uppercase; font-size: var(--text-xs); }
.ds-table tbody tr:hover { background: var(--surface-warm); }
</style>
</head>
<body>
  <header class="topnav">
    <div class="container topnav-inner">
      <a class="logo" href="index.html" style="--logo-size: var(--text-lg);">
        <span class="logo-mark">DH</span>
        <span class="logo-text">DH_STANDARD</span>
      </a>
      <nav class="nav-links">
        <a href="architecture.html">ARCH</a>
        <a href="structure.html">STR</a>
        <a href="sheet-general.html">SHEET</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="hero">
      <div class="container hero-grid">
        <h1 class="display" style="--display-size: clamp(32px, 6vw, 64px);">반복 작업을 버튼으로 끝낸다.</h1>
        <p class="lead">DH_Standard.extension의 현재 배포 스크립트를 탐색하고, 작동에 필요한 패밀리나 매개변수 정보를 확인합니다.</p>
      </div>
    </section>
  </main>
</body>
</html>
